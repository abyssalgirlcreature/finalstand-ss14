- type: entity
  parent: BaseAction
  id: FSTransmogAction
  name: Hide Armour
  description: Hides your armour and helmet so the clothes underneath show. Protection is unaffected.
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
  - type: Sprite
    layers:
    - sprite: Clothing/OuterClothing/Armor/bulletproof.rsi
      state: icon
      map: ["enum.ActionVisuals.Icon"]
    - sprite: Clothing/Uniforms/Jumpskirt/capformaldress.rsi
      state: icon
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:FSTransmogActionEvent {}
